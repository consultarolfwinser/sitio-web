<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#17372f">
  <title>Descargar guía | Rolf Winser Vargas</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/images/apple-touch-icon.png">
  <link rel="stylesheet" href="/assets/css/styles.css?v=20260904-1">
</head>
<body class="download-confirm-page">
  <main class="download-confirm-shell">
    <section class="download-confirm-card" aria-labelledby="download-title">
      <a href="/" aria-label="Ir al inicio de Rolf Winser Vargas">
        <img class="download-confirm-logo" src="/assets/images/logo-rw.png" width="72" height="72" alt="Logo de Rolf Winser Vargas">
      </a>
      <p class="kicker">Guía gratuita</p>
      <h1 id="download-title" data-download-title>Preparando tu guía</h1>
      <p class="download-confirm-copy" data-download-copy>Estamos revisando el enlace recibido por correo.</p>

      <form class="download-confirm-form" action="https://script.google.com/macros/s/AKfycbwNU-nTGovdp0xsxD26R-WjXK85v0uMSF4p2kEvZnFE8oQE1OoVqBwUct7nmAUEJ2Hy/exec" method="post" target="download-confirm-target" data-download-confirm-form hidden>
        <input type="hidden" name="action" value="confirm_download">
        <input type="hidden" name="delivery_mode" value="website">
        <input type="hidden" name="token" data-download-token>
        <input type="hidden" name="resource_id" data-download-resource>
        <button class="button" type="submit">Confirmar y descargar</button>
      </form>

      <p class="download-confirm-status" data-download-confirm-status aria-live="polite"></p>
      <a class="download-confirm-back" href="/recursos.html">Volver a los recursos</a>
    </section>
  </main>
  <iframe name="download-confirm-target" data-download-confirm-frame title="Confirmación de la descarga" hidden></iframe>
  <script src="/assets/js/download.js?v=20260904-1" defer></script>
</body>
</html>
